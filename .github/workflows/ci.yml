name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # No standalone yarn.lock is committed (developed inside the diamonds-dev-env
      # workspace); CI forces immutable-by-default, so --no-immutable is required.
      # Peer deps (@diamondslab/diamonds, hardhat-diamonds, hardhat, ethers,
      # hardhat-ethers) are also devDependencies, so a plain install builds standalone.
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Build
        run: yarn build

      # No lint gate: eslint reports a pending prettier-formatting backlog (deferred,
      # same posture as @diamondslab/diamonds). The mocha suite is TS-only and does not
      # shell out to the `forge` binary, so no Foundry toolchain is needed here.
      - name: Test
        run: yarn test
